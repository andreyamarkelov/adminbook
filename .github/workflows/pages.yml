name: Build and Deploy Answers Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site

          declare -A chapter_titles=(
            ["chapter_2"]="Chapter 2: Documentation and Basic Commands"
            ["chapter_3"]="Chapter 3: Bash Scripting"
            ["chapter_4"]="Chapter 4: User and Group Management"
            ["chapter_5"]="Chapter 5: Disk Management and LVM"
            ["chapter_6"]="Chapter 6: Filesystems and Storage"
            ["chapter_7"]="Chapter 7: System Management"
            ["chapter_8"]="Chapter 8: Task Scheduling and Remote Access"
            ["chapter_9"]="Chapter 9: Package Management"
            ["chapter_10"]="Chapter 10: Networking"
            ["chapter_11"]="Chapter 11: SELinux"
          )

          declare -A chapter_topics=(
            ["chapter_2"]="<li>Man pages, info pages</li><li>Bash aliases</li><li>Find command and pipes</li><li>Vim tutorial</li>"
            ["chapter_3"]="<li>Argument processing</li><li>File and directory operations</li><li>Conditional statements and loops</li><li>Test operators</li>"
            ["chapter_4"]="<li>Creating users and groups</li><li>User modification and deletion</li><li>Password aging policies</li><li>Sudo configuration</li>"
            ["chapter_5"]="<li>Disk partitioning (fdisk)</li><li>Physical volumes and volume groups</li><li>Logical volumes</li><li>LVM cleanup</li>"
            ["chapter_6"]="<li>GPT partitioning (parted)</li><li>XFS filesystem</li><li>fstab configuration</li><li>SGID permissions</li><li>Swap files</li>"
            ["chapter_7"]="<li>Systemd targets</li><li>Journal logs</li><li>Process management (ps, nice, renice)</li><li>TuneD profiles</li>"
            ["chapter_8"]="<li>Background jobs</li><li>at command</li><li>Cron jobs</li><li>Time management (timedatectl)</li><li>SSH key generation and configuration</li>"
            ["chapter_9"]="<li>DNF operations</li><li>RPM queries</li><li>Repository management</li><li>Flatpak applications</li>"
            ["chapter_10"]="<li>Network interface configuration</li><li>NetworkManager (nmcli)</li><li>Static and DHCP configurations</li><li>Hostname and DNS management</li><li>Firewall configuration (firewall-cmd)</li>"
            ["chapter_11"]="<li>SELinux contexts</li><li>File and port labeling</li><li>SELinux booleans</li>"
          )

          html_escape() {
            sed -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g'
          }

          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Adminbook Answers</title>'
            echo '<style>'
            echo 'body{font-family:Arial,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;line-height:1.45}'
            echo 'a{color:#0b57d0;text-decoration:none}a:hover{text-decoration:underline}'
            echo 'h1,h2{line-height:1.2}li{margin:.35rem 0}.muted{color:#555}'
            echo '</style></head><body>'
            echo '<h1>Adminbook Exercise Answers</h1>'
            echo '<p class="muted">Generated by GitHub Actions.</p>'
            echo '<h2>Chapters</h2><ul>'
          } > site/index.html

          while IFS= read -r chapter_dir; do
            chapter_name="$(basename "${chapter_dir}")"
            chapter_page="${chapter_name}.html"
            chapter_title="${chapter_titles[${chapter_name}]:-${chapter_name}}"
            chapter_topic_items="${chapter_topics[${chapter_name}]:-}"

            {
              echo '<!doctype html>'
              echo '<html lang="en"><head><meta charset="utf-8">'
              echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
              printf '<title>%s Answers</title>\n' "${chapter_title}"
              echo '<style>'
              echo 'body{font-family:Arial,sans-serif;max-width:1080px;margin:2rem auto;padding:0 1rem;line-height:1.45}'
              echo 'a{color:#0b57d0;text-decoration:none}a:hover{text-decoration:underline}'
              echo 'pre{background:#111;color:#f4f4f4;padding:1rem;border-radius:.5rem;overflow:auto}'
              echo 'code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}'
              echo 'h1,h2{line-height:1.2}hr{margin:1.2rem 0;border:none;border-top:1px solid #ddd}'
              echo '</style></head><body>'
              printf '<p><a href="./index.html">&larr; Back to index</a></p>\n'
              printf '<h1>%s</h1>\n' "${chapter_title}"
              if [ -n "${chapter_topic_items}" ]; then
                echo '<h2>Topics</h2>'
                printf '<ul>%s</ul>\n' "${chapter_topic_items}"
              fi
              echo '<hr>'
              echo '<p>Exercise answer scripts:</p>'
            } > "site/${chapter_page}"

            while IFS= read -r script_file; do
              script_name="$(basename "${script_file}")"
              {
                printf '<h2>%s</h2>\n' "${script_name}"
                echo '<pre><code>'
                html_escape < "${script_file}"
                echo '</code></pre>'
              } >> "site/${chapter_page}"
            done < <(printf '%s\n' "${chapter_dir}"/exercise*.sh | sort)

            echo '</body></html>' >> "site/${chapter_page}"
            printf '<li><a href="./%s">%s</a></li>\n' "${chapter_page}" "${chapter_title}" >> site/index.html
          done < <(printf '%s\n' chapter_* | sort -V)

          {
            echo '</ul>'
            echo '</body></html>'
          } >> site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
