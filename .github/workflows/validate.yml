name: Validate Scripts

on:
  push:
    branches: [main]
    paths:
      - 'chapter_**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'chapter_**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check (bash -n)
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find chapter_* -name '*.sh' | sort)

      - name: ShellCheck
        run: |
          set -euo pipefail
          find chapter_* -name '*.sh' -print0 | xargs -0 shellcheck \
            -e SC1090,SC1091,SC2009,SC2034,SC2035,SC2038,SC2086,SC2154,SC2162
